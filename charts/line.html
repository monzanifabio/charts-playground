<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      const t = localStorage.getItem("charts-playground-theme");
      if (t) document.documentElement.dataset.theme = t;
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Line Chart — Charts Playground</title>
    <link rel="stylesheet" href="/src/base.css" />
    <link rel="stylesheet" href="/src/charts.css" />
  </head>
  <body>
    <div class="chart-page">
      <header class="chart-header">
        <a href="/" class="back-link">← Charts</a>
        <h1>Line Chart</h1>
        <p>Filled area lines tracking weekly sessions by platform.</p>
      </header>
      <canvas id="chart"></canvas>
      <section class="chart-section">
        <div class="chart-header">
          <h2>Linear Interpolation</h2>
          <p>Same dataset without curve smoothing.</p>
        </div>
        <canvas id="chart-linear"></canvas>
      </section>
    </div>
    <script type="module" src="./line.js"></script>
  </body>
</html>
